name: Fetch Clips Minimal

on:
  push:
    branches:
      - arena/51211cc8-videos
    paths:
      - '.github/workflows/fetch-clips-minimal.yml'
  workflow_dispatch:
    inputs:
      video_id:
        description: YouTube video ID or URL
        required: true
        default: 'https://youtu.be/HMkWwp3l9KQ'

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg + yt-dlp
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q yt-dlp
      - name: Download video (720p)
        run: |
          yt-dlp -f 'bv*[height<=720]+ba/b[height<=720]' \
            --merge-output-format mp4 -o source.mp4 \
            '${{ github.event.inputs.video_id || 'https://youtu.be/HMkWwp3l9KQ' }}'
          ls -lh source.mp4

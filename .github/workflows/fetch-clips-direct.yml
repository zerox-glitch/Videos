name: Fetch Clips Direct

on:
  # v4 trigger probe
  push:
    branches:
      - arena/51211cc8-videos
    paths:
      - '.github/workflows/fetch-clips-direct.yml'
  workflow_dispatch:
    inputs:
      video_id:
        description: YouTube video ID or URL
        required: true
        default: 'https://youtu.be/HMkWwp3l9KQ'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up FFmpeg, Cloudflare WARP & bgutil POT provider
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg gpg lsb-release

          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq && sudo apt-get install -y -qq cloudflare-warp
          sudo systemctl start warp-svc || true
          sleep 2
          warp-cli --accept-tos registration new || yes | warp-cli registration new || true
          warp-cli --accept-tos mode proxy || warp-cli mode proxy || true
          warp-cli --accept-tos proxy port 40000 || warp-cli proxy port 40000 || true
          warp-cli --accept-tos connect || warp-cli connect || true
          sleep 4

          docker run --name bgutil-provider -d --init -p 127.0.0.1:4416:4416 brainicism/bgutil-ytdlp-pot-provider
          sleep 4

          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

          python3 -m pip install -q --upgrade pip
          python3 -m pip install -q -U --pre "yt-dlp[default]"
          python3 -m pip install -q bgutil-ytdlp-pot-provider PySocks

      - name: Download & cut caption-free clips
        run: |
          python3 scripts/remote_fetch.py \
            --video-id '${{ github.event.inputs.video_id || 'https://youtu.be/HMkWwp3l9KQ' }}' \
            --mode clips --threshold 0.35 --min-clip 2.0 --max-clip 20.0
      - name: Commit clips to branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f assets/source/fetch_diagnostics.txt || true
          git add clips/ || true
          git diff --cached --quiet || git commit -m "chore: fetch clips for ${{ github.event.inputs.video_id }} [skip ci]"
          git push origin HEAD:arena/51211cc8-videos || true

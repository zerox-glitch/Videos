name: Fetch Source Clips

on:
  workflow_dispatch:
  push:
    branches:
      - arena/51211cc8-videos
    paths:
      - '.github/workflows/fetch-clips.yml'
      - 'scripts/remote_fetch.py'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: arena/51211cc8-videos
          fetch-depth: 0

      - name: Set up FFmpeg, Deno, Cloudflare WARP & bgutil POT provider
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg gpg lsb-release

          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq && sudo apt-get install -y -qq cloudflare-warp
          sudo systemctl start warp-svc || true
          sleep 2
          warp-cli --accept-tos registration new || yes | warp-cli registration new || true
          warp-cli --accept-tos mode proxy || warp-cli mode proxy || true
          warp-cli --accept-tos proxy port 40000 || warp-cli proxy port 40000 || true
          warp-cli --accept-tos connect || warp-cli connect || true
          sleep 4

          docker run --name bgutil-provider -d --init -p 127.0.0.1:4416:4416 brainicism/bgutil-ytdlp-pot-provider
          sleep 4

          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

          python3 -m pip install -q --upgrade pip
          python3 -m pip install -q -U --pre "yt-dlp[default]"
          python3 -m pip install -q bgutil-ytdlp-pot-provider PySocks faster-whisper numpy

      - name: Download & extract viral clips + word timestamps
        run: |
          export PATH="$HOME/.deno/bin:$PATH"
          mkdir -p assets/source
          set -o pipefail
          python3 scripts/remote_fetch.py 2>&1 | tee assets/source/fetch_log.txt

      - name: Commit extracted source clips to branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin arena/51211cc8-videos || true
          git add assets/source/
          git diff --cached --quiet || git commit -m "chore: add extracted Brian Cox source clips and word timestamps [skip ci]"
          git push origin HEAD:arena/51211cc8-videos
